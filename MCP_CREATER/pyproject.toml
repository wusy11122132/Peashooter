[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "readonly-database-mcp"
version = "0.1.0"
description = "Local read-only MCP server for MySQL and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "clickhouse-connect>=1.4,<2",
  "mcp[cli]>=1.28,<2",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "sqlglot>=30.12,<31",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
readonly-database-mcp = "readonly_database_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readonly_database_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

