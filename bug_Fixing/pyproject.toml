[project]
name = "internal-error-mail-analyzer"
version = "0.1.0"
description = "Read-only IMAP intake for internal slots error analysis in Codex"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6,<26",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
bugmail = "bugmail.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bugmail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["bugmail"]
omit = ["bugmail/__main__.py", "bugmail/approval.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["bugmail"]
check_untyped_defs = true
ignore_missing_imports = true
